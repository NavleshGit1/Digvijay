# AirOps Nexus — Pre-Commit Hook Configuration
# Implements Task P1-1 (Platform Skeleton QA & Formatting)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^(\.github/|helm/)
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=1000']

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: lint-clock
        name: Enforce AST Virtual Clock Rule
        entry: python scripts/lint_clock.py backend/app
        language: system
        types: [python]
        pass_filenames: false

      - id: frontend-lint
        name: Frontend ESLint
        entry: npm run --prefix frontend lint
        language: system
        types: [javascript, jsx, ts, tsx]
        pass_filenames: false
